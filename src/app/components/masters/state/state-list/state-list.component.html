<nz-card [nzBordered]="false" nzTitle="State Master" [nzExtra]="extraTemplate">
@if(listOfStates.length >0){
<nz-table #basicTable [nzData]="listOfStates">
  <thead>
    <tr>
      <th>id</th>
      <th>Name</th>
      <th>Country name</th>
      <th>Country Code</th>
    </tr>
  </thead>
  <tbody>
    @for (data of listOfStates; track data) {
    <tr>
      <td>{{ data.id }}</td>
      <td>{{ data.name }}</td>
      <td>{{ data.country?.name }}</td>
      <td>{{ data.country?.code }}</td>
      <td>
        <!-- Edit Button (Default with Border) -->
        <button class="m-1" nz-button nzType="default" nzSize="small" (click)="editState(data.id)">Edit</button>

        <!-- Delete Button (Danger Red) -->
        <button class="m-1" nz-button nzType="primary" nzDanger nzSize="small">Delete</button>
      </td>
    </tr>
    }
  </tbody>
</nz-table>
}
</nz-card>

<ng-template #extraTemplate>
  <button nz-button nzType="default" (click)="editState()">Add State</button>
</ng-template>
