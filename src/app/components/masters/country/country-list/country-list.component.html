<nz-card [nzBordered]="false" nzTitle="Country Master" [nzExtra]="extraTemplate">
@if(listOfCountries.length >0){
<nz-table #basicTable [nzData]="listOfCountries">
  <thead>
    <tr>
      <th>id</th>
      <th>Name</th>
      <th>Code</th>
    </tr>
  </thead>
  <tbody>
    @for (data of listOfCountries; track data) {
    <tr>
      <td>{{ data.id }}</td>
      <td>{{ data.name }}</td>
      <td>{{ data.code }}</td>
      <td>
        <button class="m-1" nz-button nzType="default" nzSize="small" (click)="editCountry(data)">Edit</button>
        <button class="m-1" nz-button nzType="primary" nzDanger nzSize="small" (click)="delete(data)">Delete</button>
      </td>
    </tr>
    }
  </tbody>
</nz-table>
}
</nz-card>

<ng-template #extraTemplate>
  <button nz-button nzType="primary" (click)="editCountry()">Add Country</button>
</ng-template>
