<div class="login-container" nz-row nzJustify="center" nzAlign="middle">
  <div nz-col [nzXs]="24" [nzSm]="20" [nzMd]="16" [nzLg]="12" [nzXl]="8">
    <nz-card class="login-card" [nzBordered]="false">
      <form nz-form [formGroup]="loginForm" class="login-form" (ngSubmit)="submitForm()">
        <nz-form-item>
          <nz-form-control nzErrorTip="Please input your email!">
            <nz-input-group nzPrefixIcon="mail">
              <input type="email" nz-input formControlName="email" placeholder="email" />
            </nz-input-group>
          </nz-form-control>
        </nz-form-item>
        <nz-form-item>
          <nz-form-control nzErrorTip="Please input your Password!">
            <nz-input-group nzPrefixIcon="lock">
              <input type="password" nz-input formControlName="password" placeholder="Password" />
            </nz-input-group>
          </nz-form-control>
        </nz-form-item>
        <div nz-row class="login-form-margin">
          <div nz-col [nzSpan]="12">
            <label nz-checkbox formControlName="remember">
              <span>Remember me</span>
            </label>
          </div>
          <div nz-col [nzSpan]="12">
            <a class="login-form-forgot" (click)="forgotPassword()">Forgot password</a>
          </div>
        </div>
        <button nz-button class="login-form-button login-form-margin" [nzType]="'primary'" [nzBlock]="true">Log
          in</button>
        <div class="text-center">
          Or <a [routerLink]="['/register']">register now!</a>
        </div>
      </form>
    </nz-card>
  </div>
</div>
